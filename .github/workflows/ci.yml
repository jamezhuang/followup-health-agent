name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      PROVIDER_MODE: demo
      EXTERNAL_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: apps/api
      - run: python -m pytest tests/test_run_checkpoints.py tests/test_task_lookup.py tests/test_knowledge_observability.py tests/test_knowledge_publications.py tests/test_knowledge_monitor.py tests/test_v2_followup.py tests/test_workflow_integration.py -q
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8080/api/health && curl --fail --output /dev/null http://127.0.0.1:8080/workspace
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down
